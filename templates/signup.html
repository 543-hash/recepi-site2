{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 card p-4 shadow border-0">
        <h2 class="text-center fw-bold mb-4">Create Account</h2>
        <form method="POST" action="/signup">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="p" class="form-control" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('p').type = (document.getElementById('p').type === 'password' ? 'text' : 'password')"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2">Sign Up</button>
            <p class="text-center mt-3">Already have account? <a href="/signin">Sign In</a></p>
        </form>
    </div>
</div>
{% endblock %}
