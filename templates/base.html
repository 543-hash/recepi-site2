<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>HEAVEN | Recipes</title>
    <style>
        body { background: #fcfcfc; font-family: 'Poppins', sans-serif; }
        .navbar { background: #1a1a1a !important; border-bottom: 4px solid #d4af37; padding: 15px 0; }
        .navbar-brand { color: #d4af37 !important; font-weight: 900; font-size: 28px; }
        .nav-link { color: white !important; font-weight: 500; margin: 0 10px; }
        .nav-link:hover { color: #d4af37 !important; }
        .btn-heaven { background: #d4af37; color: #000; font-weight: bold; border-radius: 30px; padding: 8px 25px; }
        .back-btn { position: fixed; left: 20px; top: 120px; z-index: 1000; background: #1a1a1a; color: #d4af37; border: 2px solid #d4af37; border-radius: 50px; padding: 10px 20px; text-decoration: none; font-weight: bold; }
        .back-btn:hover { background: #d4af37; color: #000; }
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="back-btn shadow"><i class="fas fa-arrow-left"></i> BACK</a>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">HEAVEN</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    {% if session.user %}
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    {% endif %}
                    <li class="nav-item"><a class="nav-link" href="/recipes">Recipes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/community">Community</a></li>
                </ul>
                <div class="d-flex text-white">
                    {% if session.user %}
                        <span class="me-3 mt-1">Hello, <b>{{ session.user }}</b></span>
                        <a href="/logout" class="btn btn-sm btn-outline-danger rounded-pill">Logout</a>
                    {% else %}
                        <a href="/signin" class="btn btn-heaven">Sign In</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
