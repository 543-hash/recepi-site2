{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow border-0 bg-dark text-white text-center" style="border-radius: 20px;">
                <img src="{{ user.profile_pic }}" class="rounded-circle mx-auto mb-3 border border-3 border-warning" width="100" height="100" style="object-fit: cover;">
                <h3 class="fw-bold text-warning">{{ user.username }}</h3>
                <p class="small text-muted">{{ user.bio }}</p>
                <a href="/settings" class="btn btn-warning btn-sm w-100 rounded-pill fw-bold">Edit Profile</a>
            </div>
            <div class="card p-4 mt-4 shadow border-0" style="border-radius: 20px;">
                <h5 class="fw-bold mb-3">Upload Recipe</h5>
                <form method="POST">
                    <input type="text" name="name" class="form-control mb-2" placeholder="Recipe Name" required>
                    <input type="text" name="city" class="form-control mb-2" placeholder="City" required>
                    <select name="category" class="form-select mb-2"><option value="pakistani">Pakistani</option><option value="chinese">Chinese</option><option value="korean">Korean</option><option value="traditional">Traditional</option></select>
                    <input type="text" name="img" class="form-control mb-2" placeholder="Image URL">
                    <textarea name="ing" class="form-control mb-2" placeholder="Ingredients (comma separated)"></textarea>
                    <textarea name="eng" class="form-control mb-2" placeholder="English steps (.)"></textarea>
                    <textarea name="urdu" class="form-control mb-2" placeholder="Urdu steps (.)"></textarea>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill fw-bold">PUBLISH</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <h2 class="fw-bold mb-4 border-bottom pb-2">Your Personal Gallery</h2>
            <div class="row">
                {% for r in recipes %}
                <div class="col-md-6 mb-4 position-relative">
                    <div class="card h-100 shadow border-0 overflow-hidden" style="border-radius: 15px;">
                        <a href="/delete_recipe/{{ r.id }}" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 shadow"><i class="fas fa-trash"></i></a>
                        <img src="{{ r.img }}" class="card-img-top" style="height: 180px; object-fit: cover;">
                        <div class="card-body"><h5>{{ r.name }}</h5></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
