{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 p-4" style="border-radius: 20px; background: white;">
                <h2 class="fw-bold text-center mb-4">Sign In to HEAVEN</h2>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-warning alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="/signin">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control py-2" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" id="loginPass" class="form-control py-2" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill py-2 shadow mt-3">SIGN IN</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="text-muted mb-2">Don't have an account yet?</p>
                    <a href="/signup" class="btn btn-outline-dark w-100 rounded-pill fw-bold">CREATE NEW ACCOUNT (SIGN UP)</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePass() {
    var x = document.getElementById("loginPass");
    var icon = document.getElementById("eyeIcon");
    if (x.type === "password") {
        x.type = "text";
        icon.className = "fas fa-eye-slash";
    } else {
        x.type = "password";
        icon.className = "fas fa-eye";
    }
}
</script>
{% endblock %}
